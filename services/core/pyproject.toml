[project]
name = "recoup"
version = "0.1.0"
description = "Revenue recovery control plane for Indian payments"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "redis>=5.2",
    "httpx>=0.27",
    "structlog>=24.4",
    "typer>=0.15",
    "numpy>=2.1",
    "scipy>=1.14",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28",
    "prometheus-client>=0.21",
    "uuid-utils>=0.10",
]

[project.scripts]
recoup = "recoup.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "testcontainers[postgres,redis]>=4.8",
    "mypy>=1.13",
    "ruff>=0.8",
    "import-linter>=2.1",
    "types-pyyaml>=6.0",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recoup"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # builtins shadowing
    "C4",          # comprehensions
    "DTZ",         # flake8-datetimez -- naive datetimes are a bug here
    "T20",         # no print()
    "SIM",         # simplify
    "PTH",         # pathlib
    "RUF",         # ruff-specific
    "S",           # bandit security
    "ASYNC",       # async correctness
    "TID",         # tidy imports
]
ignore = [
    "S101",        # assert -- used deliberately for domain invariants
    "B008",        # function call in default arg -- FastAPI Depends() idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]        # hardcoded test credentials are fine
"src/recoup/cli.py" = ["T20"]        # the CLI is allowed to print

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["recoup"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_explicit = false          # allowed with a justifying comment
show_error_codes = true
files = ["src/recoup", "tests"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "uuid_utils.*", "asyncpg.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: requires Postgres and Redis (testcontainers)",
    "e2e: full pipeline test",
    "slow: excluded from the fast feedback loop",
    "llm: calls a real LLM API -- excluded by `make test-no-llm` (ROADMAP P5)",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/recoup"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.report]
# Per-module floors (policy/attribution 100% branch, domain >=95% line --
# ENGINEERING-STANDARDS §4.3) apply once those modules hold real code; they
# are still empty package stubs. This is the one number CI can honestly
# enforce today, set at the "everything else" floor.
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]
