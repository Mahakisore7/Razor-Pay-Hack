name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # --- Lint -> Types -> Boundaries -------------------------------------
  quality-python:
    name: Python quality (ruff, mypy, import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/core/uv.lock
      - run: uv sync --locked
        working-directory: services/core
      - name: Lint (ruff)
        run: uv run ruff check .
        working-directory: services/core
      - name: Format check (ruff)
        run: uv run ruff format --check .
        working-directory: services/core
      - name: Types (mypy --strict)
        run: uv run mypy
        working-directory: services/core
      - name: Boundaries (import-linter)
        run: uv run lint-imports
        working-directory: services/core

  quality-console:
    name: Console quality (eslint, prettier, tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/console
      - name: Lint (eslint)
        run: pnpm lint
        working-directory: apps/console
      - name: Format check (prettier)
        run: pnpm format
        working-directory: apps/console
      - name: Types (tsc --strict)
        run: pnpm typecheck
        working-directory: apps/console

  # --- Unit + property -> Integration -> Coverage ----------------------
  test-python:
    name: Python tests + coverage
    needs: quality-python
    runs-on: ubuntu-latest
    # Integration tests use testcontainers (real Postgres/Redis via Docker,
    # not GitHub Actions `services:` containers -- Docker is already
    # available on this runner, and this is exactly what local dev and
    # ENGINEERING-STANDARDS §4.2 ("no mocked database") already require, so
    # there is nothing a services: block would add here.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/core/uv.lock
      - run: uv sync --locked
        working-directory: services/core
      - name: pytest (unit, property, integration) with coverage
        run: uv run pytest --cov=recoup --cov-report=term-missing --cov-report=xml
        working-directory: services/core
        # fail_under is enforced from pyproject.toml's [tool.coverage.report]
        # -- this is the coverage gate, not a separate step.
      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: services/core/coverage.xml

  test-console:
    name: Console tests (vitest, Playwright smoke)
    needs: quality-console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/console
      - run: pnpm test
        working-directory: apps/console
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/console
      - run: pnpm test:e2e
        working-directory: apps/console
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/console/playwright-report
          retention-days: 7

  # --- Security ----------------------------------------------------------
  security:
    name: Security (gitleaks, pip-audit, pnpm audit)
    needs: [test-python, test-console]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history, not just the merge commit
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact -v

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/core/uv.lock
      - run: uv sync --locked
        working-directory: services/core
      - name: pip-audit
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -o /tmp/requirements-audit.txt
          uv run pip-audit -r /tmp/requirements-audit.txt --strict
        working-directory: services/core

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/console
      - name: pnpm audit
        # `pnpm audit` hits npm's bulk advisories endpoint, which is
        # occasionally slow to respond from CI runners; its own retry logic
        # (2 retries, fixed 10s/60s backoff) is hardcoded and unaffected by
        # .npmrc's fetch-retries. Wrap it in an outer retry loop so a
        # registry blip doesn't fail the job -- this is a wider budget on
        # top of pnpm's own, not a replacement for it.
        run: |
          for attempt in 1 2 3 4 5; do
            if pnpm audit --audit-level=high; then
              exit 0
            fi
            echo "pnpm audit attempt $attempt/5 failed, retrying in 30s..."
            sleep 30
          done
          echo "pnpm audit failed after 5 attempts"
          exit 1
        working-directory: apps/console

  # --- Build ---------------------------------------------------------------
  build:
    name: Build images + trivy scan
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api/worker/scheduler + console images
        run: docker compose -f infra/docker-compose.yml --project-directory . build
      - name: Trivy -- services/core image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: recoup-api:latest
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true # a CVE with no available fix isn't actionable
          exit-code: "1"
      - name: Trivy -- console image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: recoup-console:latest
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"
